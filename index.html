<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Arcade - Free Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #fff; display: flex; flex-direction: column; min-height: 100vh; text-align: center; }
    
    header { background: #1e293b; padding: 15px; border-bottom: 2px solid #334155; }
    header h1 { color: #38bdf8; font-size: 24px; }

    /* Navigation Tabs */
    .tab-bar { display: flex; justify-content: center; gap: 10px; padding: 15px; background: #0f172a; flex-wrap: wrap; }
    .tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .tab-btn.active, .tab-btn:hover { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

    /* Game Container */
    .game-area { flex: 1; display: flex; justify-content: center; align-items: center; padding: 10px; }
    .game-screen { display: none; width: 100%; max-width: 450px; height: 550px; background: #1e293b; border-radius: 12px; border: 1px solid #334155; overflow: hidden; }
    .game-screen.active { display: flex; justify-content: center; align-items: center; }

    /* Embed Frame */
    iframe { width: 100%; height: 100%; border: none; background: #000; }

    /* AD CONTAINER */
    .ad-slot { width: 100%; max-width: 728px; height: 90px; margin: 10px auto; background: #1e293b; border: 1px dashed #475569; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #64748b; font-size: 12px; }
  </style>
</head>
<body>

  <header>
    <h1>🎮 Pocket Arcade</h1>
  </header>

  <!-- Game Selector Buttons -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="showGame('game1', this)">🔢 2048</button>
    <button class="tab-btn" onclick="showGame('game2', this)">🐦 Flappy Bird</button>
    <button class="tab-btn" onclick="showGame('game3', this)">❌ Tic-Tac-Toe</button>
  </div>

  <main class="game-area">
    <!-- GAME 1: 2048 (Open Source Embed) -->
    <div id="game1" class="game-screen active">
      <iframe src="https://play2048.co/"></iframe>
    </div>

    <!-- GAME 2: FLAPPY BIRD (Open Source Embed) -->
    <div id="game2" class="game-screen">
      <iframe src="https://ciaranmcnamara.github.io/flappy-bird/"></iframe>
    </div>

    <!-- GAME 3: TIC-TAC-TOE (Open Source Embed) -->
    <div id="game3" class="game-screen">
      <iframe src="https://tic-tac-toe-three-theta-78.vercel.app/"></iframe>
    </div>
  </main>

  <!-- MONETAG AD CONTAINER -->
  <div class="ad-slot">
    <!-- PASTE YOUR MONETAG SCRIPT HERE -->
    <span>Advertisement Banner Space</span>
  </div>

  <script>
    function showGame(gameId, btn) {
      document.querySelectorAll('.game-screen').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(gameId).classList.add('active');
      btn.classList.add('active');
    }
  </script>
</body>
</html>
